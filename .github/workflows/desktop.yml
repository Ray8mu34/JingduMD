name: Desktop checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: macOS checks and packages
        if: runner.os == 'macOS'
        run: node scripts/release-macos.mjs ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Windows frontend tests
        if: runner.os == 'Windows'
        run: pnpm test
      - name: Windows Rust formatting
        if: runner.os == 'Windows'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Windows Rust lint
        if: runner.os == 'Windows'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Windows Rust tests
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Windows packages
        if: runner.os == 'Windows'
        run: node node_modules/@tauri-apps/cli/tauri.js build -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: JingReader-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/macos/**
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
