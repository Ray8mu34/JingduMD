[package]
name = "jingreader"
version = "0.7.2"
description = "不接管目录的本地 Markdown 阅读器"
authors = ["JingReader"]
edition = "2021"

[lib]
name = "jingreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
walkdir = "2.5"
encoding_rs = "0.8"
mime_guess = "2"
parking_lot = "0.12"
ureq = "2.12"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
